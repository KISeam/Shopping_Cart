<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopping Cart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-gray-300">
    <section class="container mx-auto px-4 py-12">
      <h2 class="text-3xl font-bold text-gray-800 mb-8">Select Products</h2>
      <div
        id="product-list"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </section>

    <section class="container mx-auto px-4 py-12">
      <h2 class="text-3xl font-bold text-gray-800 mb-8">My Shopping Cart</h2>
      <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <div id="cart-items" class="hidden"></div>
        <div class="p-6">
          <div class="flex flex-col space-y-4">
            <div class="flex justify-between">
              <h5 class="text-lg text-gray-600">Subtotal</h5>
              <h5 class="text-lg font-semibold text-gray-800">
                $<span id="sub-total">0</span>
              </h5>
            </div>
            <div class="flex justify-between">
              <h5 class="text-lg text-gray-600">
                Tax <span class="text-sm font-semibold">(10%)</span>
              </h5>
              <h5 class="text-lg font-semibold text-gray-800">
                $<span id="tax-amount">0</span>
              </h5>
            </div>
            <div class="flex justify-between">
              <h5 class="text-lg text-gray-600">Total</h5>
              <h5 class="text-lg font-semibold text-gray-800">
                $<span id="total-price">0</span>
              </h5>
            </div>
          </div>
        </div>
        <div class="p-6 bg-gray-50">
          <button
            id="send-message"
            class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg transition-colors duration-200"
          >
            Send Purchase Message
          </button>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
